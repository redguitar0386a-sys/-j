<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finger Tracking Test</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; color: white; font-family: sans-serif; }
        canvas { width: 100vw; height: auto; display: block; }
        #info { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 5px; }
        .axis { position: absolute; top: 50%; left: 0; width: 100%; height: 1px; background: rgba(0, 255, 0, 0.5); }
    </style>
</head>
<body>
    <div id="info">
        L (Offset): <span id="value">0</span> px<br>
        <small>赤い線を画面中央に合わせてください</small>
    </div>
    <div class="axis"></div>
    <video id="video" style="display:none" autoplay playsinline></video>
    <canvas id="canvas"></canvas>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const valueDisplay = document.getElementById('value');

        let baseY = null; // 基準となる中心座標

        // カメラ起動
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false })
            .then(stream => {
                video.srcObject = stream;
                requestAnimationFrame(process);
            });

        function process() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                const frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = frame.data;

                let sumY = 0;
                let count = 0;

                // 全ピクセルをスキャンして「赤色」を探す
                for (let i = 0; i < data.length; i += 4) {
                    const r = data[i];
                    const g = data[i + 1];
                    const b = data[i + 2];

                    // 赤色の判定条件（Rが大きく、GとBが小さい）
                    if (r > 150 && g < 80 && b < 80) {
                        const y = Math.floor((i / 4) / canvas.width);
                        sumY += y;
                        count++;
                    }
                }

                if (count > 0) {
                    const centerY = sumY / count;
                    
                    // 最初に検知した位置、または画面中央を基準軸にする
                    if (baseY === null) baseY = canvas.height / 2;

                    // 軸からのズレを計算
                    const deltaL = Math.abs(centerY - baseY);
                    valueDisplay.innerText = deltaL.toFixed(2);

                    // 視覚化：赤い線の中心に青い丸を描画
                    ctx.fillStyle = "blue";
                    ctx.beginPath();
                    ctx.arc(canvas.width / 2, centerY, 10, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            requestAnimationFrame(process);
        }
    </script>
</body>
</html>
