<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>VR Camera Viewer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

body {
background: #000;
overflow: hidden;
font-family: ‘Courier New’, monospace;
width: 100vw;
height: 100vh;
}

#rotate-msg {
display: none;
position: fixed;
inset: 0;
background: #000;
color: #fff;
flex-direction: column;
align-items: center;
justify-content: center;
gap: 1rem;
z-index: 999;
font-size: 0.9rem;
letter-spacing: 0.15em;
text-align: center;
}
.rotate-icon {
font-size: 3rem;
animation: rotateAnim 1.5s ease-in-out infinite;
}
@keyframes rotateAnim {
0%,100% { transform: rotate(0deg); }
50% { transform: rotate(90deg); }
}
@media (orientation: portrait) {
#rotate-msg { display: flex; }
}

#start-screen {
position: fixed;
inset: 0;
background: #000;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
z-index: 100;
gap: 2rem;
}
.logo {
font-size: clamp(2rem, 6vw, 4rem);
font-weight: 900;
letter-spacing: 0.3em;
color: #fff;
text-transform: uppercase;
}
.subtitle {
color: #555;
font-size: 0.8rem;
letter-spacing: 0.2em;
text-transform: uppercase;
}
#start-btn {
background: #fff;
border: none;
color: #000;
padding: 1rem 3rem;
font-family: inherit;
font-size: 0.9rem;
letter-spacing: 0.2em;
text-transform: uppercase;
cursor: pointer;
}
#start-btn:hover { background: #ddd; }

#vr-container {
display: none;
width: 100vw;
height: 100vh;
position: relative;
}

.eye {
position: absolute;
top: 0;
width: 50%;
height: 100%;
overflow: hidden;
}
#left-eye  { left: 0; }
#right-eye { left: 50%; }

.eye video {
width: 100%;
height: 100%;
object-fit: cover;
display: block;
}

#divider {
position: fixed;
left: 50%;
top: 0;
width: 4px;
height: 100%;
background: #000;
transform: translateX(-50%);
z-index: 10;
}

#ipd-wrap {
position: fixed;
bottom: 1rem;
left: 50%;
transform: translateX(-50%);
z-index: 20;
display: none;
flex-direction: column;
align-items: center;
gap: 0.3rem;
}
#ipd-label {
color: rgba(255,255,255,0.4);
font-size: 0.55rem;
letter-spacing: 0.15em;
}
#ipd {
-webkit-appearance: none;
width: 120px;
height: 2px;
background: rgba(255,255,255,0.3);
outline: none;
cursor: pointer;
}
#ipd::-webkit-slider-thumb {
-webkit-appearance: none;
width: 12px;
height: 12px;
border-radius: 50%;
background: #fff;
}

#exit-btn {
position: fixed;
top: 0.8rem;
right: 0.8rem;
z-index: 20;
background: rgba(0,0,0,0.5);
border: 1px solid rgba(255,255,255,0.3);
color: rgba(255,255,255,0.6);
padding: 0.4rem 0.8rem;
font-family: inherit;
font-size: 0.6rem;
letter-spacing: 0.15em;
cursor: pointer;
display: none;
text-transform: uppercase;
}
#exit-btn:hover { color: #fff; border-color: #fff; }

#error-msg {
position: fixed;
inset: 0;
display: none;
align-items: center;
justify-content: center;
background: #000;
color: #fff;
font-size: 0.9rem;
letter-spacing: 0.1em;
text-align: center;
padding: 2rem;
z-index: 200;
flex-direction: column;
gap: 1rem;
}
#error-msg button {
background: #fff;
border: none;
color: #000;
padding: 0.5rem 1.5rem;
font-family: inherit;
cursor: pointer;
letter-spacing: 0.15em;
font-size: 0.7rem;
text-transform: uppercase;
margin-top: 0.5rem;
}
</style>

</head>
<body>

<div id="rotate-msg">
  <div class="rotate-icon">📱</div>
  <div>端末を横向きにしてください</div>
</div>

<div id="start-screen">
  <div class="logo">VR MODE</div>
  <div class="subtitle">Stereoscopic Camera Viewer</div>
  <button id="start-btn" onclick="startVR()">▶ カメラを起動</button>
</div>

<div id="error-msg">
  <div id="error-text">カメラへのアクセスが拒否されました</div>
  <button onclick="location.reload()">再試行</button>
</div>

<div id="vr-container">
  <div id="left-eye" class="eye">
    <video id="video-left" autoplay playsinline muted></video>
  </div>
  <div id="right-eye" class="eye">
    <video id="video-right" autoplay playsinline muted></video>
  </div>
  <div id="divider"></div>
</div>

<div id="ipd-wrap">
  <div id="ipd-label">IPD</div>
  <input type="range" id="ipd" min="-60" max="60" value="0" oninput="adjustIPD(this.value)">
</div>

<button id="exit-btn" onclick="exitVR()">✕ EXIT</button>

<script>
let stream = null;

async function startVR() {
  try {
    try { await screen.orientation.lock('landscape'); } catch(e) {}

    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    });

    const vL = document.getElementById('video-left');
    const vR = document.getElementById('video-right');
    vL.srcObject = stream;
    vR.srcObject = stream;
    await Promise.all([vL.play(), vR.play()]);

    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('vr-container').style.display = 'block';
    document.getElementById('ipd-wrap').style.display = 'flex';
    document.getElementById('exit-btn').style.display = 'block';

    try { await document.documentElement.requestFullscreen(); } catch(e) {}

  } catch(err) {
    const errText = document.getElementById('error-text');
    if (err.name === 'NotAllowedError') {
      errText.textContent = 'カメラへのアクセスが拒否されました。\nブラウザの設定でカメラを許可してください。';
    } else if (err.name === 'NotFoundError') {
      errText.textContent = 'カメラが見つかりません。';
    } else {
      errText.textContent = 'カメラの起動に失敗しました: ' + err.message;
    }
    document.getElementById('error-msg').style.display = 'flex';
  }
}

function adjustIPD(val) {
  const offset = parseInt(val);
  document.getElementById('video-left').style.transform  = `translateX(${offset}px)`;
  document.getElementById('video-right').style.transform = `translateX(${-offset}px)`;
}

function exitVR() {
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  try { screen.orientation.unlock(); } catch(e) {}
  if (document.exitFullscreen && document.fullscreenElement) document.exitFullscreen();
  document.getElementById('vr-container').style.display = 'none';
  document.getElementById('ipd-wrap').style.display = 'none';
  document.getElementById('exit-btn').style.display = 'none';
  document.getElementById('start-screen').style.display = 'flex';
}

document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
</script>

</body>
</html>
