<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finger Tracking Fix</title>
    <style>
        body { margin: 0; background: #000; color: #0f0; font-family: monospace; overflow: hidden; }
        #info { position: absolute; top: 10px; left: 10px; z-index: 10; background: rgba(0,0,0,0.8); padding: 15px; border: 1px solid #0f0; }
        canvas { width: 100vw; height: 100vh; object-fit: contain; }
        #start-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 20px; font-size: 20px; z-index: 20; cursor: pointer; }
    </style>
</head>
<body>
    <button id="start-btn">カメラを起動して開始</button>
    <div id="info">
        Offset: <span id="value">0.00</span> px<br>
        Status: <span id="status">Waiting...</span>
    </div>
    
    <video id="video" autoplay playsinline muted style="display:none"></video>
    <canvas id="canvas"></canvas>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const valueDisplay = document.getElementById('value');
        const statusDisplay = document.getElementById('status');
        const startBtn = document.getElementById('start-btn');

        let baseY = null;

        startBtn.onclick = () => {
            startBtn.style.display = 'none';
            initCamera();
        };

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" }, 
                    audio: false 
                });
                video.srcObject = stream;
                // iOS対策: 明示的にplay()を呼ぶ
                await video.play();
                statusDisplay.innerText = "Running";
                requestAnimationFrame(process);
            } catch (err) {
                statusDisplay.innerText = "Error: " + err.message;
            }
        }

        function process() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                const frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = frame.data;

                let sumY = 0;
                let count = 0;

                // スキャン範囲を中央付近に絞ると高速化＆精度向上します
                for (let i = 0; i < data.length; i += 4) {
                    const r = data[i];
                    const g = data[i + 1];
                    const b = data[i + 2];

                    // 赤色判定（環境に合わせて150の数値を調整してください）
                    if (r > 130 && g < 100 && b < 100) {
                        const y = Math.floor((i / 4) / canvas.width);
                        sumY += y;
                        count++;
                    }
                }

                if (count > 5) { // ノイズ回避のため5ピクセル以上で反応
                    const centerY = sumY / count;
                    if (baseY === null) baseY = centerY;

                    const deltaL = centerY - baseY;
                    valueDisplay.innerText = deltaL.toFixed(2);

                    // 可視化（青い線で現在の位置を表示）
                    ctx.strokeStyle = "cyan";
                    ctx.lineWidth = 5;
                    ctx.beginPath();
                    ctx.moveTo(0, centerY);
                    ctx.lineTo(canvas.width, centerY);
                    ctx.stroke();
                }
            }
            // ループを維持
            requestAnimationFrame(process);
        }
    </script>
</body>
</html>
