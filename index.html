<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>VR Camera Viewer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

body {
background: #000;
overflow: hidden;
font-family: ‘Courier New’, monospace;
width: 100vw;
height: 100vh;
}

#start-screen {
position: fixed;
inset: 0;
background: radial-gradient(ellipse at center, #0a0a1a 0%, #000 100%);
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
z-index: 100;
gap: 2rem;
}

.logo {
font-size: clamp(2rem, 6vw, 4rem);
font-weight: 900;
letter-spacing: 0.3em;
color: #fff;
text-transform: uppercase;
position: relative;
}
.logo::before {
content: ‘VR MODE’;
position: absolute;
inset: 0;
color: #00ffe7;
clip-path: polygon(0 0, 100% 0, 100% 50%, 0 50%);
transform: translateX(3px);
opacity: 0.6;
}
.logo::after {
content: ‘VR MODE’;
position: absolute;
inset: 0;
color: #ff2d78;
clip-path: polygon(0 50%, 100% 50%, 100% 100%, 0 100%);
transform: translateX(-3px);
opacity: 0.6;
}

.subtitle {
color: #555;
font-size: 0.8rem;
letter-spacing: 0.2em;
text-transform: uppercase;
}

#start-btn {
background: transparent;
border: 1px solid #00ffe7;
color: #00ffe7;
padding: 1rem 3rem;
font-family: inherit;
font-size: 0.9rem;
letter-spacing: 0.2em;
text-transform: uppercase;
cursor: pointer;
position: relative;
overflow: hidden;
transition: color 0.3s;
}
#start-btn::before {
content: ‘’;
position: absolute;
inset: 0;
background: #00ffe7;
transform: translateX(-100%);
transition: transform 0.3s;
z-index: -1;
}
#start-btn:hover::before { transform: translateX(0); }
#start-btn:hover { color: #000; }

/* VR container */
#vr-container {
display: none;
width: 100vw;
height: 100vh;
position: relative;
}

.eye {
position: absolute;
top: 0;
width: 50%;
height: 100%;
overflow: hidden;
}
#left-eye  { left: 0; }
#right-eye { left: 50%; }

.eye video {
width: 100%;
height: 100%;
object-fit: cover;
display: block;
}

/* Barrel distortion via SVG filter */
#left-eye  { filter: url(#barrel-left); }
#right-eye { filter: url(#barrel-right); }

/* Center divider */
#divider {
position: fixed;
left: 50%;
top: 0;
width: 4px;
height: 100%;
background: #000;
transform: translateX(-50%);
z-index: 10;
}

/* HUD overlays */
.hud {
position: absolute;
inset: 0;
pointer-events: none;
z-index: 5;
}

/* Crosshair */
.crosshair {
position: absolute;
top: 50%;
left: 50%;
transform: translate(-50%, -50%);
width: 24px;
height: 24px;
}
.crosshair::before,
.crosshair::after {
content: ‘’;
position: absolute;
background: rgba(0,255,231,0.6);
}
.crosshair::before { width: 2px; height: 100%; left: 50%; transform: translateX(-50%); }
.crosshair::after  { width: 100%; height: 2px; top: 50%; transform: translateY(-50%); }

/* Corner brackets */
.corner {
position: absolute;
width: 20px;
height: 20px;
border-color: rgba(0,255,231,0.4);
border-style: solid;
}
.corner.tl { top: 12px; left: 12px; border-width: 2px 0 0 2px; }
.corner.tr { top: 12px; right: 12px; border-width: 2px 2px 0 0; }
.corner.bl { bottom: 12px; left: 12px; border-width: 0 0 2px 2px; }
.corner.br { bottom: 12px; right: 12px; border-width: 0 2px 2px 0; }

/* Scan line effect */
.scanlines {
position: absolute;
inset: 0;
background: repeating-linear-gradient(
0deg,
transparent,
transparent 2px,
rgba(0,0,0,0.08) 2px,
rgba(0,0,0,0.08) 4px
);
pointer-events: none;
z-index: 6;
}

/* Vignette */
.vignette {
position: absolute;
inset: 0;
background: radial-gradient(ellipse at center,
transparent 50%,
rgba(0,0,0,0.7) 100%
);
pointer-events: none;
z-index: 7;
}

/* Info badge */
#info {
position: fixed;
bottom: 1.5rem;
left: 50%;
transform: translateX(-50%);
z-index: 20;
display: none;
gap: 2rem;
align-items: center;
}
.badge {
color: rgba(0,255,231,0.5);
font-size: 0.6rem;
letter-spacing: 0.15em;
text-transform: uppercase;
}

/* IPD slider */
#ipd-wrap {
position: fixed;
top: 1rem;
left: 50%;
transform: translateX(-50%);
z-index: 20;
display: none;
flex-direction: column;
align-items: center;
gap: 0.3rem;
}
#ipd-label {
color: rgba(0,255,231,0.4);
font-size: 0.55rem;
letter-spacing: 0.15em;
}
#ipd {
-webkit-appearance: none;
width: 120px;
height: 2px;
background: rgba(0,255,231,0.2);
outline: none;
cursor: pointer;
}
#ipd::-webkit-slider-thumb {
-webkit-appearance: none;
width: 10px;
height: 10px;
border-radius: 50%;
background: #00ffe7;
}

#exit-btn {
position: fixed;
top: 1rem;
right: 1rem;
z-index: 20;
background: transparent;
border: 1px solid rgba(255,45,120,0.4);
color: rgba(255,45,120,0.6);
padding: 0.4rem 0.8rem;
font-family: inherit;
font-size: 0.6rem;
letter-spacing: 0.15em;
cursor: pointer;
display: none;
text-transform: uppercase;
transition: all 0.2s;
}
#exit-btn:hover {
border-color: #ff2d78;
color: #ff2d78;
}

/* Error message */
#error-msg {
position: fixed;
inset: 0;
display: none;
align-items: center;
justify-content: center;
background: #000;
color: #ff2d78;
font-size: 0.9rem;
letter-spacing: 0.1em;
text-align: center;
padding: 2rem;
z-index: 200;
flex-direction: column;
gap: 1rem;
}
#error-msg button {
background: transparent;
border: 1px solid #ff2d78;
color: #ff2d78;
padding: 0.5rem 1.5rem;
font-family: inherit;
cursor: pointer;
letter-spacing: 0.15em;
font-size: 0.7rem;
text-transform: uppercase;
margin-top: 0.5rem;
}
</style>

</head>
<body>

<!-- SVG filters for barrel distortion -->

<svg style="position:absolute;width:0;height:0">
  <defs>
    <filter id="barrel-left" x="-5%" y="-5%" width="110%" height="110%">
      <feDisplacementMap in="SourceGraphic" scale="0" xChannelSelector="R" yChannelSelector="G">
        <feFuncR type="gamma" amplitude="1" exponent="1" offset="0"/>
      </feDisplacementMap>
    </filter>
    <filter id="barrel-right" x="-5%" y="-5%" width="110%" height="110%">
      <feDisplacementMap in="SourceGraphic" scale="0" xChannelSelector="R" yChannelSelector="G">
        <feFuncR type="gamma" amplitude="1" exponent="1" offset="0"/>
      </feDisplacementMap>
    </filter>
  </defs>
</svg>

<!-- Start Screen -->

<div id="start-screen">
  <div class="logo">VR MODE</div>
  <div class="subtitle">Stereoscopic Camera Viewer</div>
  <button id="start-btn" onclick="startVR()">▶ カメラを起動</button>
</div>

<!-- Error Screen -->

<div id="error-msg">
  <div id="error-text">カメラへのアクセスが拒否されました</div>
  <button onclick="location.reload()">再試行</button>
</div>

<!-- VR View -->

<div id="vr-container">
  <div id="left-eye" class="eye">
    <video id="video-left" autoplay playsinline muted></video>
    <div class="hud">
      <div class="crosshair"></div>
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>
    </div>
    <div class="scanlines"></div>
    <div class="vignette"></div>
  </div>

  <div id="right-eye" class="eye">
    <video id="video-right" autoplay playsinline muted></video>
    <div class="hud">
      <div class="crosshair"></div>
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>
    </div>
    <div class="scanlines"></div>
    <div class="vignette"></div>
  </div>

  <div id="divider"></div>
</div>

<!-- Controls -->

<div id="ipd-wrap">
  <div id="ipd-label">IPD ADJUST</div>
  <input type="range" id="ipd" min="-40" max="40" value="0" oninput="adjustIPD(this.value)">
</div>

<div id="info">
  <span class="badge">◀ LEFT EYE</span>
  <span class="badge" style="color:rgba(255,45,120,0.4)">●</span>
  <span class="badge">RIGHT EYE ▶</span>
</div>

<button id="exit-btn" onclick="exitVR()">✕ EXIT</button>

<script>
let stream = null;

async function startVR() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment',
        width: { ideal: 1920 },
        height: { ideal: 1080 }
      },
      audio: false
    });

    const vL = document.getElementById('video-left');
    const vR = document.getElementById('video-right');
    vL.srcObject = stream;
    vR.srcObject = stream;

    await Promise.all([vL.play(), vR.play()]);

    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('vr-container').style.display = 'block';
    document.getElementById('info').style.display = 'flex';
    document.getElementById('ipd-wrap').style.display = 'flex';
    document.getElementById('exit-btn').style.display = 'block';

    // Fullscreen
    try {
      if (document.documentElement.requestFullscreen) {
        await document.documentElement.requestFullscreen();
      }
    } catch(e) {}

  } catch(err) {
    const errEl = document.getElementById('error-msg');
    const errText = document.getElementById('error-text');
    if (err.name === 'NotAllowedError') {
      errText.textContent = 'カメラへのアクセスが拒否されました。\nブラウザの設定でカメラを許可してください。';
    } else if (err.name === 'NotFoundError') {
      errText.textContent = 'カメラが見つかりません。';
    } else {
      errText.textContent = 'カメラの起動に失敗しました: ' + err.message;
    }
    errEl.style.display = 'flex';
  }
}

function adjustIPD(val) {
  const lEye = document.getElementById('left-eye');
  const rEye = document.getElementById('right-eye');
  const offset = parseInt(val);
  lEye.querySelector('video').style.transform = `translateX(${offset}px)`;
  rEye.querySelector('video').style.transform = `translateX(${-offset}px)`;
}

function exitVR() {
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }
  if (document.exitFullscreen && document.fullscreenElement) {
    document.exitFullscreen();
  }
  document.getElementById('vr-container').style.display = 'none';
  document.getElementById('info').style.display = 'none';
  document.getElementById('ipd-wrap').style.display = 'none';
  document.getElementById('exit-btn').style.display = 'none';
  document.getElementById('start-screen').style.display = 'flex';
}

// Prevent scroll on mobile
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
</script>

</body>
</html>
